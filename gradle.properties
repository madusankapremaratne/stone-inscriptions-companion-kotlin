# Compose + KSP builds need more than Gradle's default heap.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Required: the app depends on AndroidX libraries.
android.useAndroidX=true
# Each module's R class holds only its own resources (AGP 8 default for new projects).
android.nonTransitiveRClass=true
kotlin.code.style=official
